<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Elimu AI - Real AI</title>
<style>:root{--green:#0f6d3f;--bg:#f4f6f2;--card:#fff}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);padding-bottom:90px}header{display:flex;justify-content:space-between;padding:14px 16px;background:#fff;position:sticky;top:0;z-index:10}.logo{font-weight:800;color:var(--green);font-size:22px}.card{background:var(--card);border-radius:20px;margin:14px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.somo{border-radius:18px;padding:12px;text-align:center;cursor:pointer;border:2px solid transparent;background:#f0f0f0;transition:.2s}.somo.selected{border-color:var(--green);background:#dcfce7;transform:scale(1.02)}.tab{flex:1;padding:10px;border-radius:30px;border:none;font-weight:700;background:#eee;cursor:pointer}.tab.active{background:var(--green);color:#fff}.tabs{display:flex;gap:8px;margin-bottom:12px}textarea{width:100%;border:none;background:#f5f5f5;border-radius:16px;padding:14px;min-height:110px;font-size:16px;outline:none;resize:vertical}.btn-main{width:100%;background:linear-gradient(180deg,#15803d,#0f6d3f);color:#fff;border:none;padding:16px;border-radius:16px;font-size:18px;font-weight:800;margin-top:12px;cursor:pointer}.btn-main:disabled{opacity:.6}.answer-card{background:#eef6ee;border-radius:18px;padding:14px;margin-top:16px;border:1px solid #c8e6c9;animation:pop .3s ease}@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}.step{background:#fff;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}.jibu{background:#0f6d3f;color:#fff;border-radius:14px;padding:16px;font-weight:500;margin-top:10px;white-space:pre-wrap;line-height:1.7;max-height:60vh;overflow-y:auto;font-size:15px}.actions{display:flex;gap:8px;margin-top:12px}.action-btn{flex:1;padding:12px;border-radius:30px;border:none;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.btn-copy{background:#fff;color:#0f6d3f;border:1px solid #c8e6c9!important}.btn-share{background:#0f6d3f;color:#fff}.btn-save{background:#fef3c7;color:#92400e}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:30px;font-size:14px;z-index:100;display:none}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee}.bottom-nav div{text-align:center;font-size:11px;color:#888}.bottom-nav .active{color:var(--green);font-weight:700}
</style></head>
<body><header><div class="logo">Elimu AI ✦ REAL AI</div><div style="background:#dcfce7;color:#0f6d3f;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800">AI LIVE ✅</div></header>
<div class="card"><h3 style="margin-bottom:10px">Chagua Somo</h3><div class="grid" id="somoGrid">
<div class="somo selected" data-somo="General">All<br><span style="font-size:11px">Yote</span></div><div class="somo" data-somo="Math">Math<br><span style="font-size:11px">Hisabati</span></div><div class="somo" data-somo="Biology">Bio<br><span style="font-size:11px">Biologia</span></div><div class="somo" data-somo="Kiswahili">Kiswa<br><span style="font-size:11px">Lugha</span></div><div class="somo" data-somo="History">Hist<br><span style="font-size:11px">Historia</span></div><div class="somo" data-somo="English">Eng<br><span style="font-size:11px">Kiingereza</span></div></div></div>
<div class="card"><div class="tabs"><button class="tab active">✍️ Type Question</button><button class="tab" id="photoBtn">📷 Upload Photo</button></div><textarea id="qInput" placeholder="Andika swali LOLOTE..."></textarea><input type="file" id="photoInput" accept="image/*" style="display:none"><button class="btn-main" id="solveBtn">✦ Pata Jibu - AI Halisi</button><div id="resultArea"></div></div>
<div id="toast" class="toast"></div>
<div class="bottom-nav"><div class="active">🏠<br>Home</div><div>📄<br>Past Papers</div><div>🔖<br>Saved</div><div>👥<br>Parent</div><div>🛒<br>Soko Bei</div></div>
<script>
let selectedSomo="General";
document.querySelectorAll('.somo').forEach(el=>{el.addEventListener('click',()=>{document.querySelectorAll('.somo').forEach(s=>s.classList.remove('selected'));el.classList.add('selected');selectedSomo=el.dataset.somo;});});
document.getElementById('photoBtn').addEventListener('click',()=>document.getElementById('photoInput').click());
function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
async function copyText(text){try{await navigator.clipboard.writeText(text);showToast('✅ Ime-Copy!');}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('✅ Ime-Copy!');}}
async function shareText(title,text){if(navigator.share){try{await navigator.share({title:title,text:text});showToast('✅ Shared!');return;}catch{}}copyText(text);}
async function saveText(q,a){let saved=JSON.parse(localStorage.getItem('elimu_saved')||'[]');saved.unshift({q:q,a:a,time:new Date().toLocaleString()});localStorage.setItem('elimu_saved',JSON.stringify(saved.slice(0,20)));showToast('🔖 Saved!');}
async function askRealAI(question,somo){
  const prompt=`You are Elimu AI, Kenyan CBC expert. Subject: ${somo}. Answer in simple Swahili-English mix, step-by-step, Class 6-8. Question: ${question}`;
  try{const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));let t=await res.text();if(t&&t.length>10)return t;}catch{}
  return "Pole! Jaribu tena baada ya sec 5.";
}
document.getElementById('solveBtn').addEventListener('click',async()=>{
  const q=document.getElementById('qInput').value.trim();if(!q){showToast('Andika swali!');return;}
  const btn=document.getElementById('solveBtn');const resultArea=document.getElementById('resultArea');
  btn.disabled=true;btn.innerHTML='⏳ AI Inafikiri...';resultArea.innerHTML='<div class="answer-card"><div class="step">🤖 Inajibu: <b>'+q+'</b></div><div class="step">⏳ Subiri 3-6 sec...</div></div>';
  const answer=await askRealAI(q,selectedSomo);
  const safe=answer.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  resultArea.innerHTML=`<div class="answer-card"><h4 style="color:#0f6d3f">✅ Hatua kwa Hatua:</h4><div class="step">1. Swali: ${q}</div><div class="step">2. Somo: ${selectedSomo}</div><div class="jibu" id="jibuText">${safe}</div><div class="actions"><button class="action-btn btn-copy" id="copyBtn">📋 Copy</button><button class="action-btn btn-share" id="shareBtn">📤 Share</button><button class="action-btn btn-save" id="saveBtn">🔖 Save</button></div></div>`;
  document.getElementById('copyBtn').onclick=()=>copyText(q+"\n\n"+answer);
  document.getElementById('shareBtn').onclick=()=>shareText('Elimu AI - '+q, q+"\n\n"+answer+"\n\nhttps://ismaelwelson172-max.github.io/homework-msaada/");
  document.getElementById('saveBtn').onclick=()=>saveText(q,answer);
  btn.disabled=false;btn.innerHTML='✦ Pata Jibu - AI Halisi';window.scrollTo(0,document.body.scrollHeight);showToast('✅ Jibu tayari!');
});
</script></body></html>
