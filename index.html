<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Elimu AI - Real AI</title>
<style>:root{--green:#0f6d3f;--bg:#f4f6f2;--card:#fff}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);padding-bottom:90px}header{display:flex;justify-content:space-between;padding:14px 16px;background:#fff;position:sticky;top:0}.logo{font-weight:800;color:var(--green);font-size:22px}.card{background:var(--card);border-radius:20px;margin:14px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.somo{border-radius:18px;padding:12px;text-align:center;cursor:pointer;border:2px solid transparent;background:#f0f0f0}.somo.selected{border-color:var(--green);background:#dcfce7}.tab{flex:1;padding:10px;border-radius:30px;border:none;font-weight:700;background:#eee}.tab.active{background:var(--green);color:#fff}.tabs{display:flex;gap:8px;margin-bottom:12px}textarea{width:100%;border:none;background:#f5f5f5;border-radius:16px;padding:14px;min-height:110px;font-size:16px;outline:none}.btn-main{width:100%;background:linear-gradient(180deg,#15803d,#0f6d3f);color:#fff;border:none;padding:16px;border-radius:16px;font-size:18px;font-weight:800;margin-top:12px;cursor:pointer}.btn-main:disabled{opacity:.6}.answer-card{background:#eef6ee;border-radius:18px;padding:14px;margin-top:16px;border:1px solid #c8e6c9}.step{background:#fff;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}.jibu{background:var(--green);color:#fff;border-radius:14px;padding:14px;font-weight:600;margin-top:10px;white-space:pre-wrap;line-height:1.6}.loader{border:3px solid #c8e6c9;border-top:3px solid var(--green);border-radius:50%;width:24px;height:24px;animation:spin 1s linear infinite;display:inline-block}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee}.bottom-nav div{text-align:center;font-size:11px;color:#888}.bottom-nav .active{color:var(--green);font-weight:700}</style></head>
<body><header><div class="logo">Elimu AI ✦ REAL AI</div></header>
<div class="card"><div style="display:flex;justify-content:space-between"><h3>Chagua Somo</h3><span style="background:var(--green);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px">AI LIVE ✅</span></div><div class="grid" id="somoGrid">
<div class="somo selected" data-somo="General">All<br><span>Yote</span></div><div class="somo" data-somo="Math">Math</div><div class="somo" data-somo="Biology">Bio</div><div class="somo" data-somo="Kiswahili">Kiswa</div><div class="somo" data-somo="History">Hist</div><div class="somo" data-somo="English">Eng</div></div></div>
<div class="card"><div class="tabs"><button class="tab active">Type Question</button><button class="tab" id="photoBtn">📷 Upload Photo</button></div><textarea id="qInput" placeholder="Andika swali LOLOTE... e.g. What is driving? Explain osmosis?"></textarea><input type="file" id="photoInput" accept="image/*" style="display:none"><button class="btn-main" id="solveBtn">✦ Pata Jibu - AI Halisi</button><div id="resultArea"></div></div>
<div class="bottom-nav"><div class="active">🏠<br>Home</div><div>📄<br>Past Papers</div><div>🔖<br>Saved</div><div>👥<br>Parent</div><div>🛒<br>Soko Bei</div></div>
<script>
let selectedSomo="General";
document.querySelectorAll('.somo').forEach(el=>{el.addEventListener('click',()=>{document.querySelectorAll('.somo').forEach(s=>s.classList.remove('selected'));el.classList.add('selected');selectedSomo=el.dataset.somo;});});
document.getElementById('photoBtn').addEventListener('click',()=>document.getElementById('photoInput').click());
async function askRealAI(question,somo){
  const prompt=`You are Elimu AI, Kenyan CBC homework helper. Subject: ${somo}. Explain in simple Swahili+English mix, step by step, Class 6-8 level. Question: ${question}`;
  try{
    const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));
    if(!res.ok) throw new Error('fail');
    return await res.text();
  }catch(e){return "Pole, AI error. Jaribu tena. Swali: "+question;}
}
document.getElementById('solveBtn').addEventListener('click',async()=>{
  const q=document.getElementById('qInput').value.trim();
  if(!q){alert('Andika swali!');return;}
  const btn=document.getElementById('solveBtn');
  btn.disabled=true;btn.innerHTML='⏳ AI Inafikiri...';
  document.getElementById('resultArea').innerHTML='<div class="answer-card"><div class="step">🤖 Inajibu: '+q+'</div><div class="step">⏳ Subiri 3-5 sec...</div></div>';
  const answer=await askRealAI(q,selectedSomo);
  document.getElementById('resultArea').innerHTML=`<div class="answer-card"><h4>✅ Hatua kwa Hatua:</h4><div class="step">1. Swali: ${q}</div><div class="step">2. Somo: ${selectedSomo}</div><div class="jibu">${answer}</div></div>`;
  btn.disabled=false;btn.innerHTML='✦ Pata Jibu - AI Halisi';
  window.scrollTo(0,document.body.scrollHeight);
});
</script></body></html>
